name: Build Nameless APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip project
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -name 'NamelessPet*.zip' -print -quit)
          test -n "$ZIP" || exit 1
          unzip -q "$ZIP" -d extracted
          test -f extracted/NamelessPet/settings.gradle

      - name: Build APK
        working-directory: extracted/NamelessPet
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessPet-APK
          path: extracted/NamelessPet/app/build/outputs/apk/debug/*.apk
